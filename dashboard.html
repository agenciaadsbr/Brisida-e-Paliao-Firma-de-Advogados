<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leads — Brísida e Palião</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#0A0A0A;--card:#171717;--line:#262626;--line2:#2E2E2E;--tx:#FAFAFA;--mu:#A3A3A3;--mu2:#737373;--acc:#D9BE86;--ok:#22C55E;--blue:#60A5FA;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--mu)}
.btn{background:transparent;border:1px solid var(--line2);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12px;letter-spacing:.06em;font-weight:600;color:var(--tx)}
.btn:hover{background:#1F1F1F;border-color:#3A3A3A}
.btn-pri{background:var(--tx);color:#0A0A0A;border-color:var(--tx)}
.btn-pri:hover{background:#E5E5E5}
input[type=text],input[type=password],input[type=date]{background:#0F0F0F;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;outline:none;color-scheme:dark}
input:focus{border-color:#525252}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .card{width:100%;max-width:360px;padding:28px}
#login h1{font-size:15px;letter-spacing:.08em;margin:0 0 4px}
#login p{margin:0 0 20px;font-size:13px}
#login label{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px}
#login input{width:100%}
#login .btn{width:100%;margin-top:20px;padding:11px}
#lerr{color:#F87171;font-size:12px;min-height:18px;margin-top:10px}
/* app */
#app{display:none}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.head h1{font-size:18px;letter-spacing:.06em;margin:0;font-weight:700}
.head p{margin:4px 0 0;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mu)}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ch-head h2,.card h2{font-size:13px;letter-spacing:.04em;margin:0;font-weight:600}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--mu);letter-spacing:.06em}
.range input{padding:6px 8px;font-size:12px}
.chart{position:relative;height:280px}
.legend{display:flex;gap:18px;justify-content:center;margin-top:12px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.grid2{display:grid;gap:14px;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--mu2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.sub{display:block;font-size:12px;color:var(--mu2);margin-top:2px}
.tbl{overflow-x:auto;margin-top:10px}
.wa{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:7px;padding:6px 10px;color:var(--tx);text-decoration:none;font-size:12px;white-space:nowrap}
.wa:hover{border-color:var(--ok);color:var(--ok)}
.wa svg{width:14px;height:14px}
.empty{color:var(--mu2);text-align:center;padding:28px 10px}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tbar input{width:220px;padding:7px 10px;font-size:12px}
.status{font-size:12px;color:var(--mu2)}
@media (max-width:720px){
  .kpis{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .kpi{padding:14px}.kpi .v{font-size:20px}
  .chart{height:230px}
  .tbar input{width:100%}
  .head h1{font-size:15px}
  thead{display:none}
  #leads-t tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}
  #leads-t td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 2px}
  #leads-t td::before{content:attr(data-l);color:var(--mu2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  #leads-t td .sub{text-align:right}
}
</style>
</head>
<body>

<section id="login">
  <form class="card" id="lform" autocomplete="on">
    <h1>LEADS — BRÍSIDA E PALIÃO</h1>
    <p class="muted">Acesso restrito à equipe do escritório.</p>
    <label for="lu">Usuário</label>
    <input type="text" id="lu" autocomplete="username" value="Admin" required>
    <label for="lp">Senha</label>
    <input type="password" id="lp" autocomplete="current-password" required>
    <button class="btn btn-pri" type="submit" id="lbtn">ENTRAR</button>
    <div id="lerr" role="alert"></div>
  </form>
</section>

<main id="app" class="wrap">
  <div class="head">
    <div>
      <h1>LEADS — BRÍSIDA E PALIÃO</h1>
      <p class="muted" id="total">Carregando…</p>
    </div>
    <button class="btn" id="sair">SAIR</button>
  </div>

  <div class="kpis">
    <div class="card kpi"><div class="l">Visitas</div><div class="v" id="k-vis">—</div></div>
    <div class="card kpi"><div class="l">Leads</div><div class="v" id="k-lead">—</div></div>
    <div class="card kpi"><div class="l">Conversão</div><div class="v" id="k-conv">—</div></div>
  </div>

  <div class="card">
    <div class="ch-head">
      <h2>Evolução diária</h2>
      <div class="range">
        <span>DE</span><input type="date" id="de">
        <span>ATÉ</span><input type="date" id="ate">
      </div>
    </div>
    <div class="chart"><canvas id="ch" aria-label="Gráfico de visitas, cadastros e conversão por dia"></canvas></div>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>Visitas</span>
      <span><i style="background:var(--ok)"></i>Cadastros</span>
      <span><i style="background:var(--acc)"></i>Taxa de conversão %</span>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Conversão por LP</h2>
      <div class="tbl">
        <table>
          <thead><tr><th>LP</th><th class="num">Visitas</th><th class="num">Leads</th><th class="num">Conv.</th></tr></thead>
          <tbody id="lp-t"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="tbar">
        <h2>Leads</h2>
        <input type="text" id="busca" placeholder="Buscar por nome ou WhatsApp" aria-label="Buscar lead">
      </div>
      <div class="tbl">
        <table>
          <thead><tr><th>Nome</th><th>WhatsApp</th><th>LP</th><th>Origem</th><th>Data</th><th>Ação</th></tr></thead>
          <tbody id="leads-t"></tbody>
        </table>
      </div>
    </div>
  </div>
  <p class="status" id="status"></p>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function () {
  "use strict";
  var C = window.LP_CONFIG || {};
  var SITE = C.site || "brisida-paliao";
  var CLIENTE = C.nomeCliente || "Brísida e Palião";
  var USERS = { "admin": "admin@" + SITE + ".adsbr.internal" }; // usuário exibido -> e-mail no Supabase Auth
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, { auth: { persistSession: true, storageKey: "lp-dash-" + SITE } });
  var $ = function (id) { return document.getElementById(id); };
  var chart = null, cache = { visits: [], leads: [] };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmtTel(w) {
    var d = String(w || "").replace(/\D/g, ""); if (d.indexOf("55") === 0 && d.length > 11) d = d.slice(2);
    if (d.length === 11) return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
    if (d.length === 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
    return w || "";
  }
  function waNum(w) { var d = String(w || "").replace(/\D/g, ""); return d.length <= 11 ? "55" + d : d; }
  function fmtData(iso) { var d = new Date(iso); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function pct(l, v) { return v ? (l / v * 100) : 0; }
  function fmtPct(x) { return x.toFixed(1).replace(".", ",") + "%"; }

  /* ---------- Login ---------- */
  function show(logged) { $("login").style.display = logged ? "none" : "grid"; $("app").style.display = logged ? "block" : "none"; }
  $("lform").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("lu").value.trim().toLowerCase(), email = USERS[u] || (u.indexOf("@") > 0 ? u : null);
    $("lerr").textContent = "";
    if (!email) { $("lerr").textContent = "Usuário não encontrado."; return; }
    $("lbtn").disabled = true; $("lbtn").textContent = "ENTRANDO…";
    sb.auth.signInWithPassword({ email: email, password: $("lp").value }).then(function (r) {
      $("lbtn").disabled = false; $("lbtn").textContent = "ENTRAR";
      if (r.error) { $("lerr").textContent = "Usuário ou senha incorretos."; return; }
      show(true); carregar();
    });
  });
  $("sair").addEventListener("click", function () { sb.auth.signOut().then(function () { show(false); $("lp").value = ""; }); });

  /* ---------- Dados ---------- */
  function fetchAll(table, cols, de, ate) {
    var out = [], step = 1000;
    function page(from) {
      return sb.from(table).select(cols).eq("site", SITE)
        .gte("created_at", de.toISOString()).lt("created_at", ate.toISOString())
        .order("created_at", { ascending: false }).range(from, from + step - 1)
        .then(function (r) {
          if (r.error) throw r.error;
          out = out.concat(r.data || []);
          return (r.data || []).length === step ? page(from + step) : out;
        });
    }
    return page(0);
  }

  function periodo() {
    var de = new Date($("de").value + "T00:00:00"), ate = new Date($("ate").value + "T00:00:00");
    ate.setDate(ate.getDate() + 1);
    return { de: de, ate: ate };
  }

  function carregar() {
    var p = periodo();
    $("status").textContent = "Atualizando…";
    Promise.all([
      fetchAll("lp_visits", "created_at", p.de, p.ate),
      fetchAll("lp_leads", "id,nome,whatsapp,origem,servico,site,created_at", p.de, p.ate)
    ]).then(function (r) {
      cache.visits = r[0]; cache.leads = r[1];
      render(p);
      $("status").textContent = "Atualizado em " + fmtData(new Date().toISOString()) + ".";
    }).catch(function (err) {
      $("status").textContent = "Não foi possível carregar os dados (" + (err.message || err) + ").";
      if (String(err.message || "").match(/JWT|auth/i)) show(false);
    });
  }

  function render(p) {
    var V = cache.visits.length, L = cache.leads.length;
    $("total").textContent = L === 0 ? "Nenhum lead no período" : L + (L === 1 ? " lead" : " leads") + " no período";
    $("k-vis").textContent = V.toLocaleString("pt-BR");
    $("k-lead").textContent = L.toLocaleString("pt-BR");
    $("k-conv").textContent = fmtPct(pct(L, V));

    // série diária
    var days = [], idx = {}, d = new Date(p.de);
    while (d < p.ate) { var k = ymd(d); idx[k] = days.length; days.push({ k: k, v: 0, l: 0 }); d.setDate(d.getDate() + 1); }
    cache.visits.forEach(function (x) { var k = ymd(new Date(x.created_at)); if (k in idx) days[idx[k]].v++; });
    cache.leads.forEach(function (x) { var k = ymd(new Date(x.created_at)); if (k in idx) days[idx[k]].l++; });
    var labels = days.map(function (x) { return x.k.slice(8, 10) + "/" + x.k.slice(5, 7); });
    var dsV = days.map(function (x) { return x.v; }), dsL = days.map(function (x) { return x.l; }),
        dsC = days.map(function (x) { return +pct(x.l, x.v).toFixed(1); });
    var cfg = {
      type: "line",
      data: { labels: labels, datasets: [
        { label: "Visitas", data: dsV, borderColor: "#60A5FA", backgroundColor: "#60A5FA", tension: .3, pointRadius: 2, borderWidth: 2, yAxisID: "y" },
        { label: "Cadastros", data: dsL, borderColor: "#22C55E", backgroundColor: "#22C55E", tension: .3, pointRadius: 2, borderWidth: 2, yAxisID: "y" },
        { label: "Conversão %", data: dsC, borderColor: "#D9BE86", backgroundColor: "#D9BE86", borderDash: [4, 4], tension: .3, pointRadius: 0, borderWidth: 1.5, yAxisID: "y2" }
      ] },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false }, tooltip: { backgroundColor: "#0A0A0A", borderColor: "#2E2E2E", borderWidth: 1,
          callbacks: { label: function (c) { return " " + c.dataset.label + ": " + (c.datasetIndex === 2 ? String(c.parsed.y).replace(".", ",") + "%" : c.parsed.y); } } } },
        scales: {
          x: { grid: { color: "#1F1F1F" }, ticks: { color: "#737373", maxRotation: 0, autoSkipPadding: 12 } },
          y: { beginAtZero: true, grid: { color: "#1F1F1F" }, ticks: { color: "#737373", precision: 0 } },
          y2: { beginAtZero: true, position: "right", grid: { display: false }, ticks: { color: "#737373", callback: function (v) { return v + "%"; } } }
        }
      }
    };
    if (chart) chart.destroy();
    chart = new Chart($("ch"), cfg);

    // conversão por LP
    $("lp-t").innerHTML = (V === 0 && L === 0)
      ? '<tr><td colspan="4" class="empty">Nenhum dado encontrado</td></tr>'
      : "<tr><td>" + esc(SITE) + '</td><td class="num">' + V + '</td><td class="num">' + L + '</td><td class="num">' + fmtPct(pct(L, V)) + "</td></tr>";

    renderLeads();
  }

  function renderLeads() {
    var q = $("busca").value.trim().toLowerCase(), qd = q.replace(/\D/g, "");
    var rows = cache.leads.filter(function (x) {
      if (!q) return true;
      return String(x.nome || "").toLowerCase().indexOf(q) >= 0 || (qd && String(x.whatsapp || "").indexOf(qd) >= 0);
    });
    if (!rows.length) { $("leads-t").innerHTML = '<tr><td colspan="6" class="empty">Nenhum lead encontrado</td></tr>'; return; }
    $("leads-t").innerHTML = rows.map(function (x) {
      var nome = String(x.nome || "").trim(), primeiro = nome.split(/\s+/)[0] || nome;
      var msg = "Olá, " + primeiro + ". Recebemos seu contato através da " + CLIENTE + " e gostaria de dar continuidade ao seu atendimento.";
      var url = "https://wa.me/" + waNum(x.whatsapp) + "?text=" + encodeURIComponent(msg);
      return "<tr>" +
        '<td data-l="Nome">' + esc(nome) + (x.servico ? '<span class="sub">' + esc(x.servico) + "</span>" : "") + "</td>" +
        '<td data-l="WhatsApp">' + esc(fmtTel(x.whatsapp)) + "</td>" +
        '<td data-l="LP">' + esc(x.site) + "</td>" +
        '<td data-l="Origem">' + esc(x.origem || "—") + "</td>" +
        '<td data-l="Data">' + esc(fmtData(x.created_at)) + "</td>" +
        '<td data-l="Ação"><a class="wa" href="' + url + '" target="_blank" rel="noopener">' +
          '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.7-1.2c.2-.6.2-1 .2-1.2l-.5-.3z"/></svg>' +
          "Chamar</a></td></tr>";
    }).join("");
  }
  $("busca").addEventListener("input", renderLeads);

  /* ---------- Período padrão: últimos 30 dias ---------- */
  var hoje = new Date(), ini = new Date(); ini.setDate(hoje.getDate() - 29);
  $("de").value = ymd(ini); $("ate").value = ymd(hoje);
  ["de", "ate"].forEach(function (id) { $(id).addEventListener("change", function () { if ($("de").value && $("ate").value) carregar(); }); });

  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) { show(true); carregar(); } else show(false);
  });
})();
</script>
</body>
</html>
